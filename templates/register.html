{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
    <form class="auth-box" method="POST">
        <h1>Create account</h1>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form.username }}"
               autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="50" required autofocus>
        <div class="auth-hint">No spaces or @.</div>

        <label for="email">Gmail address</label>
        <input type="email" id="email" name="email" value="{{ form.email }}"
               placeholder="yourname@gmail.com" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        <div class="auth-hint">Gmail only. You can log in with this or your username.</div>

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="2" maxlength="255"
                  placeholder="Street, city, province, postal code" autocomplete="street-address" required>{{ form.address }}</textarea>

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" value="{{ form.phone }}"
               placeholder="+63 917 123 4567" autocomplete="tel" inputmode="tel" required>
        <div class="auth-hint">7 to 15 digits. Spaces, dashes, brackets and a leading + are fine.</div>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
        <button type="submit">Register</button>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
</div>
{% endblock %}
