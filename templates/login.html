{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
    <form class="auth-box" method="POST">
        <h1>Log in</h1>
        <label for="identifier">Username or Gmail</label>
        <input type="text" id="identifier" name="identifier" value="{{ identifier or '' }}"
               autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
        <p class="auth-switch">No account? <a href="{{ url_for('register') }}">Register</a></p>
    </form>
</div>
{% endblock %}
